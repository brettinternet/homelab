#: schema https://mise.en.dev/schema/mise.json

[env]
_.python.venv = { path = ".venv", create = true }

[tools]
age = "latest"
age-plugin-yubikey = "latest"
"github:remko/age-plugin-se" = { version = "latest", os = ["macos"], asset_pattern = "age-plugin-se-*-macos.zip" }
betterleaks = "latest"
bun = "latest"
direnv = "latest"
docker-cli = "latest"
docker-compose = { version = "latest", postinstall = "ln -sf $(which docker-cli-plugin-docker-compose) ~/.docker/cli-plugins/docker-compose" }
lefthook = "latest"
node = "latest"
prettier = "latest"
python = "{{ get_env(name='PYTHON_VERSION', default='latest') }}"
sops = "latest"
shellcheck = "latest"
task = "latest"
uv = "latest"

[settings]
disable_backends = ["asdf", "pipx"]
pipx.uvx = true
npm.package_manager = "bun"
python.uv_venv_auto = "create|source"
experimental = true

[hooks]
enter = "mise i -q"
