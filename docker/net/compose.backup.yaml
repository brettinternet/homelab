# https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html#backblaze-b2
---
x-options: &options
  profiles: [backup]
  networks: [default]
  environment: &environment
    TZ: "${TIMEZONE}"
  restart: unless-stopped

x-remote-environment: &remote-environment
  <<: *environment
  RESTIC_REPOSITORY: "${BACKUP_S3_RESTIC_REPOSITORY}"
  RESTIC_PASSWORD: "${REMOTE_RESTIC_PASSWORD}"
  AWS_ACCESS_KEY_ID: "${BACKUP_AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${BACKUP_AWS_SECRET_ACCESS_KEY}"

services:
  restic-remote-backup:
    <<: *options
    image: mazzolino/restic:latest
    container_name: restic-remote-backup
    cap_add: [SYS_ADMIN]
    environment:
      <<: *remote-environment
      # RUN_ON_STARTUP: "true"
      BACKUP_CRON: "0 0 1 * * *"
      RESTIC_BACKUP_SOURCES: /data
      RESTIC_BACKUP_ARGS: >-
        --tag restic
        --exclude=.Trash*
        --exclude=/data/adguard/work/data/querylog.json*
        --verbose
      RESTIC_FORGET_ARGS: >-
        --group-by paths
        --keep-last 10
        --keep-daily 7
        --keep-weekly 5
        --keep-monthly 12
      PRE_COMMANDS: |-
        curl -fsS -m 10 --retry 5 -o /dev/null "https://hc.${PRIVATE_DOMAIN}/ping/${HEALTHCHECKS_RESTIC_REMOTE_BACKUP_UUID}/start"
      POST_COMMANDS_FAILURE: |-
        curl -fsS -m 10 --retry 5 -o /dev/null "https://hc.${PRIVATE_DOMAIN}/ping/${HEALTHCHECKS_RESTIC_REMOTE_BACKUP_UUID}/fail"
      POST_COMMANDS_SUCCESS: |-
        curl -fsS -m 10 --retry 5 -o /dev/null "https://hc.${PRIVATE_DOMAIN}/ping/${HEALTHCHECKS_RESTIC_REMOTE_BACKUP_UUID}"
    volumes: &backup-volumes
      - "${CONFIG_DIR}/adguard:/data/adguard"
      - "${CONFIG_DIR}/autokuma/data:/data/autokuma"
      - "${CONFIG_DIR}/beszel:/data/beszel"
      - "${CONFIG_DIR}/healthchecks:/data/healthchecks"
      - "${CONFIG_DIR}/homepage:/data/homepage"
      - "${CONFIG_DIR}/smokeping:/data/smokeping"
      - "${CONFIG_DIR}/traefik/conf:/data/traefik-conf"
      - "${CONFIG_DIR}/uptime-kuma:/data/uptime-kuma"

  restic-remote-prune:
    <<: *options
    image: mazzolino/restic:latest
    container_name: restic-remote-prune
    depends_on: [restic-remote-backup]
    environment:
      <<: *remote-environment
      PRUNE_CRON: "0 30 1 * * *"
      PRE_COMMANDS: |-
        curl -fsS -m 10 --retry 5 -o /dev/null "https://hc.${PRIVATE_DOMAIN}/ping/${HEALTHCHECKS_RESTIC_REMOTE_PRUNE_UUID}/start"
      POST_COMMANDS_FAILURE: |-
        curl -fsS -m 10 --retry 5 -o /dev/null "https://hc.${PRIVATE_DOMAIN}/ping/${HEALTHCHECKS_RESTIC_REMOTE_PRUNE_UUID}/fail"
      POST_COMMANDS_SUCCESS: |-
        curl -fsS -m 10 --retry 5 -o /dev/null "https://hc.${PRIVATE_DOMAIN}/ping/${HEALTHCHECKS_RESTIC_REMOTE_PRUNE_UUID}"

  restic-remote-check:
    <<: *options
    image: mazzolino/restic:latest
    container_name: restic-remote-check
    depends_on: [restic-remote-backup]
    environment:
      <<: *remote-environment
      CHECK_CRON: "0 45 1 * * *"
      RESTIC_CHECK_ARGS: >-
        --read-data-subset=10%
      PRE_COMMANDS: |-
        curl -fsS -m 10 --retry 5 -o /dev/null "https://hc.${PRIVATE_DOMAIN}/ping/${HEALTHCHECKS_RESTIC_REMOTE_CHECK_UUID}/start"
      POST_COMMANDS_FAILURE: |-
        curl -fsS -m 10 --retry 5 -o /dev/null "https://hc.${PRIVATE_DOMAIN}/ping/${HEALTHCHECKS_RESTIC_REMOTE_CHECK_UUID}/fail"
      POST_COMMANDS_SUCCESS: |-
        curl -fsS -m 10 --retry 5 -o /dev/null "https://hc.${PRIVATE_DOMAIN}/ping/${HEALTHCHECKS_RESTIC_REMOTE_CHECK_UUID}"

  restic-remote-restore:
    <<: *options
    profiles: [restore]
    image: mazzolino/restic:latest
    container_name: restic-remote-restore
    environment: *remote-environment
    # The image has no restore mode; args are passed straight to restic.
    # Snapshot paths are /data/<name>, so target / lands them in the mounts below.
    command: [restore, latest, --target, /]
    volumes: *backup-volumes
    restart: "no"
