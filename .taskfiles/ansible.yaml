---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

env:
  ANSIBLE_CONFIG: "{{.ROOT_DIR}}/ansible.cfg"

vars:
  ANSIBLE_PLAYBOOK_DIR: "{{.ANSIBLE_DIR}}/playbooks"
  ANSIBLE_INVENTORY_DIR: "{{.ANSIBLE_DIR}}/inventory"
  # https://github.com/ansible/ansible/issues/32554#issuecomment-572985680
  ANSIBLE_COMMAND: "env no_proxy='*' ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml"

tasks:
  init:
    desc: Install / Upgrade Ansible galaxy deps
    cmds:
      - ansible-galaxy install -r requirements.yaml -f

  lint:
    desc: Lint playbooks and roles
    cmds:
      - ansible-lint --offline

  list:
    desc: List all the hosts
    cmds:
      - ansible all -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml --list-hosts
      - echo "Groups:"
      - ansible-inventory -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml --list | jq -r "keys | .[]"

  ping:
    desc: Ping all the hosts
    cmds:
      - ansible all -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml --one-line -m 'ping'

  uptime:
    desc: Uptime of all the hosts
    cmds:
      - ansible all -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml --one-line -a 'uptime'

  playbook:
    desc: "Run a playbook, args after -- go to ansible-playbook. e.g. task ansible:run PLAYBOOK=setup -- --limit gresham --check --diff"
    aliases: [run, play, p, r]
    requires:
      vars: [PLAYBOOK]
    cmds:
      - "{{.ANSIBLE_COMMAND}} {{.ANSIBLE_PLAYBOOK_DIR}}/{{.PLAYBOOK}}.yaml {{.CLI_ARGS}}"

  setup:
    desc: "Configure hosts. e.g. task ansible:setup -- --tags docker --limit gresham"
    aliases: [s]
    cmds:
      - task: playbook
        vars: { PLAYBOOK: setup }

  upgrade:
    desc: "Upgrade packages. Reboot for a new kernel with: task ansible:upgrade -- -e upgrade__allow_reboot=true"
    aliases: [update, u]
    cmds:
      - task: playbook
        vars: { PLAYBOOK: upgrade }

  status:
    desc: Output some status fields from hosts
    cmds:
      - task: playbook
        vars: { PLAYBOOK: status }

  reboot:
    desc: Reboot hosts (use -- --limit <host>)
    prompt: Reboot the selected hosts?
    cmds:
      - task: playbook
        vars: { PLAYBOOK: reboot }
