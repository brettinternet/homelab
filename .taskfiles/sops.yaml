---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  init:
    desc: Setup SOPS
    cmds:
      - task: se

  se:
    desc: Add a Secure Enclave age identity for this Mac
    platforms: [darwin]
    cmds:
      - mkdir -p {{.AGE_DIR}} && touch {{.AGE_FILE}} && chmod 600 {{.AGE_FILE}}
      - age-plugin-se keygen --access-control=any-biometry-or-passcode >> {{.AGE_FILE}}
      - echo "Add to .sops.yaml, then run task sops:rekey:"
      - grep '^AGE-PLUGIN-SE-' {{.AGE_FILE}} | age-plugin-se recipients
    status:
      - grep -q '^AGE-PLUGIN-SE-' {{.AGE_FILE}}

  yubikey:
    desc: Add the connected YubiKey's age identity, generating one if needed (one YubiKey at a time)
    interactive: true
    cmds:
      - mkdir -p {{.AGE_DIR}} && touch {{.AGE_FILE}} && chmod 600 {{.AGE_FILE}}
      - |-
        if [ -z "$(age-plugin-yubikey --list)" ]; then
          age-plugin-yubikey --generate --pin-policy once --touch-policy cached
        fi
      - |-
        age-plugin-yubikey --identity | grep '^AGE-PLUGIN-YUBIKEY-' | while read -r id; do
          grep -qxF "$id" {{.AGE_FILE}} 2>/dev/null || echo "$id" >> {{.AGE_FILE}}
        done
      - echo "Add to .sops.yaml if new, then run task sops:rekey:"
      - age-plugin-yubikey --list | grep '^age1'
    preconditions:
      - sh: '[ "$(age-plugin-yubikey --list-all | grep -c "Serial:")" -eq 1 ]'
        msg: Connect exactly one YubiKey

  recovery:
    desc: Generate an offline recovery age key, eg "task sops:recovery file=/Volumes/USB/homelab-age.txt"
    cmds:
      - age-keygen -o {{.file}}
      - echo "Add the public key to .sops.yaml, then run task sops:rekey"
    requires:
      vars: [file]
    preconditions:
      - sh: test ! -e {{.file}}
        msg: "{{.file}} already exists"

  verify:
    desc: Check every SOPS file decrypts with the local identities
    cmds:
      - |-
        git ls-files -- '*.sops.yaml' '*.sops.yml' '*sops.env' | grep -v '^\.sops\.yaml$' | while read -r f; do
          sops decrypt "$f" >/dev/null || { echo "FAIL $f"; exit 1; }
          echo "ok $f"
        done

  check:
    desc: Check SOPS files are encrypted
    cmds:
      - |-
        unencrypted=$(find . -type f -name "*sops.*" -not -path "./.venv/*" -not -name ".sops.yaml" -exec grep -FL "ENC[AES256_GCM" {} \;)
        if [ -n "$unencrypted" ]; then
          echo "Unencrypted SOPS files:"
          echo "$unencrypted"
          exit 1
        fi

  echo:
    desc: Echo SOPS secret
    cmds:
      - sops exec-env {{.file}} 'env | grep "^{{.var}}"'
    requires:
      vars: [var, file]

  encrypt:
    desc: encrypt sops file 'to use must include -- before path to file.' eg "task sops:encrypt -- file.yaml"
    cmds:
      - sops --encrypt --in-place {{.CLI_ARGS}}

  decrypt:
    desc: decrypt sops file 'to use must include -- before path to file.'  eg "task sops:decrypt -- file.yaml"
    cmds:
      - sops --decrypt --in-place {{.CLI_ARGS}}

  decrypt-docker:
    desc: Decrypt the SOPS env files for both Docker contexts
    cmds:
      - sops --decrypt --in-place docker/net/sops.env docker/homelab/sops.env

  rekey:
    desc: Re-encrypt all SOPS files to the recipients in .sops.yaml with a fresh data key
    interactive: true
    cmd: "{{.SCRIPTS_DIR}}/sops-rekey.sh"

  list:
    desc: List all sops files
    cmds:
      - find . -name '*.sops.yaml' | while read -r file; do echo "${file}"; done

  encrypt-all:
    desc: Encrypt all unencrypted SOPS files in Ansible and Docker
    cmds:
      - for: { var: file }
        task: .encrypt-file
        vars:
          file: "{{.ITEM}}"
    vars:
      file:
        sh: |
          find "{{.ANSIBLE_DIR}}" "{{.DOCKER_DIR}}" -type f -name "*sops.*" -exec grep -L "ENC\[AES256_GCM" {} \;

  .encrypt-file:
    internal: true
    cmd: sops --encrypt --in-place {{.file}}
    requires:
      vars: ["file"]
    preconditions:
      - { msg: "Missing Sops config file", sh: "test -f {{.SOPS_CONFIG_FILE}}" }
      - { msg: "Missing Sops Age key file", sh: "test -f {{.AGE_FILE}}" }
