---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

x-dynamic-vars: &dynamic-vars
  PROJECT_DIR: "{{.ROOT_DIR}}/docker/{{.PROJECT}}"
  COMPOSE_FILES:
    sh: find {{.PROJECT_DIR}} -type f -iname "compose*.yaml" -exec basename {} ';' | sort -r
  COMPOSE_FILES_ARGS: -f {{.COMPOSE_FILES | splitLines | join " -f "}}
  COMPOSE_COMMAND: docker compose --parallel 5 -p $COMPOSE_PROJECT {{.COMPOSE_FILES_ARGS}}

vars:
  SECRETS_FILE: sops.env
  SOPS_COMMAND: sops exec-env {{.SECRETS_FILE}}

env:
  COMPOSE_HTTP_TIMEOUT: 300
  COMPOSE_PROJECT: "{{default .PROJECT .COMPOSE_PROJECT}}"
  DOCKER_HOST: "ssh://{{.HOSTNAME}}"
  COMPOSE_PROFILES: "{{.PROFILES}}"

tasks:
  default:
    silent: true
    cmds:
      - task -l

  verify:
    dir: "/{{.PROJECT_DIR}}"
    vars: *dynamic-vars
    desc: Verify compose configs on host
    cmds:
      - "echo 'Compose files:\n\n{{.COMPOSE_FILES}}'"
      - "{{.SOPS_COMMAND}} '{{.COMPOSE_COMMAND}} config'"
    requires:
      vars: [SECRETS_FILE]
    preconditions: &preconditions
      - command -v docker
      - command -v sops
      - test -f sops.env

  pull:
    dir: "/{{.PROJECT_DIR}}"
    vars: *dynamic-vars
    desc: Pull images on docker host
    cmds:
      - "{{.SOPS_COMMAND}} '{{.COMPOSE_COMMAND}} pull'"
    requires:
      vars: [SECRETS_FILE]
    preconditions: *preconditions

  sync-config:
    dir: "/{{.PROJECT_DIR}}"
    vars: *dynamic-vars
    desc: Push git-tracked config/ to the host's $CONFIG_DIR (overlay, no delete)
    # tar over ssh: no remote dependency beyond tar; COPYFILE_DISABLE keeps macOS ._ files out
    cmds:
      - >-
        {{.SOPS_COMMAND}} 'COPYFILE_DISABLE=1 tar -C config --no-xattrs --no-acls -cf - .
        | ssh {{.HOSTNAME}} "mkdir -p \"$CONFIG_DIR\" && tar -C \"$CONFIG_DIR\" --no-same-owner -xf -"'
    status:
      # skip when this stack has no committed config/ tree
      - test ! -d config
    requires:
      vars: [SECRETS_FILE, HOSTNAME]
    preconditions:
      - command -v tar
      - test -f sops.env

  up:
    dir: "/{{.PROJECT_DIR}}"
    vars: *dynamic-vars
    desc: Deploy compose files to hosts
    aliases: [start, deploy]
    cmds:
      - task: sync-config
        vars:
          PROJECT: "{{.PROJECT}}"
          HOSTNAME: "{{.HOSTNAME}}"
      - echo "Deploying '$COMPOSE_PROJECT' profiles '$COMPOSE_PROFILES' to '$DOCKER_HOST'"
      - "{{.SOPS_COMMAND}} '{{.COMPOSE_COMMAND}} up -d --remove-orphans'"
    requires:
      vars: [SECRETS_FILE]
    preconditions: *preconditions

  stop:
    dir: "/{{.PROJECT_DIR}}"
    vars: *dynamic-vars
    desc: Stop compose containers on host
    cmds:
      - "{{.SOPS_COMMAND}} '{{.COMPOSE_COMMAND}} stop'"
    requires:
      vars: [SECRETS_FILE]
    preconditions: *preconditions

  down:
    dir: "/{{.PROJECT_DIR}}"
    vars: *dynamic-vars
    desc: Stop and clean up containers on host
    cmds:
      - "{{.SOPS_COMMAND}} '{{.COMPOSE_COMMAND}} down --remove-orphans --rmi all'"
    requires:
      vars: [SECRETS_FILE]
    preconditions: *preconditions
