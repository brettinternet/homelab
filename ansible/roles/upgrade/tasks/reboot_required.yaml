---
# Batch output includes NEEDRESTART-KSTA: 1 = current, 2 = ABI-compatible upgrade, 3 = version upgrade.
- name: Check running kernel
  ansible.builtin.command: needrestart -b -k
  register: upgrade__needrestart_result
  changed_when: false
  check_mode: false

- name: Set reboot fact
  ansible.builtin.set_fact:
    upgrade__reboot_required: "{{ upgrade__needrestart_result.stdout | regex_search('NEEDRESTART-KSTA: (\\d)', '\\1') | first | int > 1 }}"
