---
- name: Upgrade official packages
  community.general.pacman:
    update_cache: true
    upgrade: true

- name: Upgrade AUR packages
  ansible.builtin.include_role:
    name: aur
  vars:
    aur__upgrade: true

- name: Check for pending kernel reboot
  ansible.builtin.include_tasks: reboot_required.yaml

- name: Reboot
  ansible.builtin.reboot:
  when:
    - upgrade__allow_reboot | bool
    - upgrade__reboot_required
