---
- name: Install essential user packages
  community.general.pacman:
    name: [git, sudo, zsh]
    state: present

- name: Set git pull strategy to rebase
  community.general.git_config:
    name: pull.rebase
    scope: system
    value: "true"

- name: Set git user
  community.general.git_config:
    name: user.name
    scope: system
    value: "{{ ansible_user }}"

- name: Ensure groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: [sudo, ssh]

# Shell is set by the dotfiles role.
- name: Add user to groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    append: true
    groups: [sudo, ssh]
