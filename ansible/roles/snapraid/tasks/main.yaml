---
- name: Install snapraid
  ansible.builtin.include_role:
    name: aur
  vars:
    aur__packages: [snapraid, snapraid-daemon]

# An unmounted path would put parity or data on the root filesystem.
- name: Check snapraid disks are mounted
  ansible.builtin.command: mountpoint -q {{ item }}
  changed_when: false
  check_mode: false
  loop: "{{ snapraid__data.values() | list + snapraid__parity | map('dirname') | list }}"

- name: Create content file directories
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ snapraid__content }}"

- name: Copy snapraid.conf
  ansible.builtin.template:
    src: snapraid.conf.j2
    dest: "{{ snapraid__conf_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Create log directory
  ansible.builtin.file:
    path: "{{ snapraid__log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy snapraidd.conf
  ansible.builtin.template:
    src: snapraidd.conf.j2
    dest: "{{ snapraid__daemon_conf_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload snapraidd

- name: Enable snapraidd
  ansible.builtin.systemd:
    name: snapraidd.service
    state: started
    enabled: true
