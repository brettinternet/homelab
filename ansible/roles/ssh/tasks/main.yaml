# TODO: secure `authorized_keys` https://wiki.archlinux.org/index.php/OpenSSH#Securing_the_authorized_keys_file
---
- name: Authorize SSH key
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ lookup('ansible.builtin.url', ssh__keys_url, wantlist=True) | first }}"
    state: present

- name: Copy sudoers defaults
  ansible.builtin.copy:
    src: sudoers-defaults
    dest: /etc/sudoers.d/defaults
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

# sshd uses the first value it reads, and drop-ins are included before the main config.
- name: Configure sshd
  ansible.builtin.copy:
    content: |
      # Managed by Ansible
      PasswordAuthentication no
      AllowGroups ssh
      AllowUsers {{ ansible_user }}
      {% for key, value in ssh__options.items() %}
      {{ key }} {{ value }}
      {% endfor %}
    dest: /etc/ssh/sshd_config.d/10-ansible.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/sshd -t -f %s
  notify: Reload sshd

# These were previously appended to sshd_config; drop-ins own them now.
- name: Remove settings appended to sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^(PasswordAuthentication|AllowGroups|AllowUsers|MaxStartups|MaxSessions)\s'
    state: absent
  notify: Reload sshd
