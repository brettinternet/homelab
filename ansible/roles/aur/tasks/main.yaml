# https://github.com/kewlfft/ansible-aur
---
- name: Create AUR build user
  ansible.builtin.user:
    name: "{{ aur__user }}"
    create_home: true

- name: Allow AUR build user to run pacman
  ansible.builtin.copy:
    content: "{{ aur__user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
    dest: "/etc/sudoers.d/11-install-{{ aur__user }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Install yay
  become: true
  become_user: "{{ aur__user }}"
  kewlfft.aur.aur:
    name: yay
    use: makepkg
    state: present

- name: Install AUR packages
  become: true
  become_user: "{{ aur__user }}"
  kewlfft.aur.aur:
    name: "{{ aur__packages }}"
    use: yay
    aur_only: true
    state: present
  when: aur__packages | length > 0

- name: Upgrade AUR packages
  become: true
  become_user: "{{ aur__user }}"
  kewlfft.aur.aur:
    use: yay
    aur_only: true
    upgrade: true
  # The module's check mode runs `yay -Qu`, which fails when nothing is upgradable.
  when: aur__upgrade and not ansible_check_mode
  tags: [upgrade]
