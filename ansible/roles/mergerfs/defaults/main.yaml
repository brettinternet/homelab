---
# Disks to mount, by device => mountpoint. /mnt/disk* are pooled.
mergerfs__disks: {}
mergerfs__pool_dir: /mnt/storage
mergerfs__branches: /mnt/disk*
# NFS-compatible options: https://github.com/trapexit/mergerfs?tab=readme-ov-file#nfs
mergerfs__options:
  - allow_other
  - use_ino
  - noforget
  - inodecalc=path-hash
  - security_capability=false
  - cache.files=partial
  - dropcacheonclose=true
  - category.create=mfs
  - fsname=mergerfs
  - minfreespace=10G
