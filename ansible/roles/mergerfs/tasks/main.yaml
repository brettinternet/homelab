# https://github.com/trapexit/mergerfs
# Maintenance: https://github.com/trapexit/backup-and-recovery-howtos/blob/master/docs/maintenance_(mergerfs).md
# Recovery: https://github.com/trapexit/backup-and-recovery-howtos/blob/master/docs/recovery_(mergerfs,snapraid).md
---
- name: Install mergerfs
  ansible.builtin.include_role:
    name: aur
  vars:
    aur__packages: [mergerfs]

- name: Install fuse2 for fstab support
  community.general.pacman:
    name: fuse2
    state: present

# https://github.com/trapexit/backup-and-recovery-howtos/blob/master/docs/setup_(fstab).md
- name: Mount disks
  ansible.posix.mount:
    src: "{{ item.key }}"
    path: "{{ item.value }}"
    fstype: xfs
    opts: defaults
    state: mounted
  loop: "{{ mergerfs__disks | dict2items }}"
  loop_control:
    label: "{{ item.value }}"

- name: Ensure pool mountpoint exists
  ansible.builtin.file:
    path: "{{ mergerfs__pool_dir }}"
    state: directory
    mode: "0755"

# `state: mounted` would remount on option changes, and remounting FUSE stacks
# another mergerfs instance instead of applying the options.
- name: Add pool to fstab
  ansible.posix.mount:
    src: "{{ mergerfs__branches }}"
    path: "{{ mergerfs__pool_dir }}"
    fstype: fuse.mergerfs
    opts: "{{ mergerfs__options | join(',') }}"
    state: present
  register: mergerfs__fstab_result

- name: Check pool is mounted
  ansible.builtin.command: mountpoint -q {{ mergerfs__pool_dir }}
  register: mergerfs__mountpoint_result
  changed_when: false
  check_mode: false
  failed_when: mergerfs__mountpoint_result.rc not in [0, 32]

- name: Mount pool # noqa command-instead-of-module
  ansible.builtin.command: mount {{ mergerfs__pool_dir }}
  changed_when: true
  when: mergerfs__mountpoint_result.rc != 0

- name: Warn that pool options need a remount
  ansible.builtin.debug:
    msg: "mergerfs options changed. Apply with `umount {{ mergerfs__pool_dir }} && mount {{ mergerfs__pool_dir }}` (stop containers first) or reboot."
  when:
    - mergerfs__fstab_result is changed
    - mergerfs__mountpoint_result.rc == 0
