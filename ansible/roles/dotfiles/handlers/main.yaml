---
- name: Run dotfiles install
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command:
    chdir: "{{ dotfiles__dir }}"
    cmd: "{{ dotfiles__install_cmd }}"
  register: dotfiles__install_result
  changed_when: true

- name: Show dotfiles install output
  ansible.builtin.debug:
    msg: "{{ dotfiles__install_result.stdout_lines }}"
  listen: Run dotfiles install

# direnv is installed by zinit, so it's only on PATH after sourcing .zshrc.
- name: Allow user directory direnv
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell:
    cmd: |
      if [ -f "$HOME/.zshrc" ]; then
        . "$HOME/.zshrc"
      fi
      direnv allow ~
    executable: /bin/zsh
  changed_when: true
