---
- name: Install packages
  community.general.pacman:
    name: [git, neovim, tmux, zsh, bat, lsd]
    state: present

- name: "Set user shell to {{ dotfiles__shell }}"
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: "{{ dotfiles__shell }}"

- name: Clone dotfiles repo # noqa latest[git]
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: "{{ dotfiles__repo }}"
    dest: "{{ dotfiles__dir }}"
    accept_hostkey: true
    update: true
    depth: 1

- name: Setup dotfiles with install command # noqa no-changed-when
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command:
    chdir: "{{ dotfiles__dir }}"
    cmd: "{{ dotfiles__install_cmd }}"
  register: dotfiles__install_result

- name: Debug dotfile setup log
  ansible.builtin.debug:
    msg: "{{ dotfiles__install_result.stdout_lines }}"
  when: dotfiles__install_result is not skipped

- name: Debug dotfile setup errors
  ansible.builtin.debug:
    msg: "{{ dotfiles__install_result.stderr_lines }}"
  when:
    - dotfiles__install_result is not skipped
    - dotfiles__install_result.stderr | length > 0

- name: Setup system env vars
  when: dotfiles__direnv_lines | length > 0
  block:
    - name: Add private environment values
      become: true
      become_user: "{{ ansible_user }}"
      ansible.builtin.lineinfile:
        path: "{{ dotfiles__direnv_file }}"
        line: "{{ item }}"
        state: present
      loop: "{{ dotfiles__direnv_lines }}"

    - name: Check direnv binary exists
      ansible.builtin.stat:
        path: /usr/bin/direnv
      register: dotfiles__direnv_stat

    - name: Allow user directory direnv # noqa no-changed-when
      become: true
      become_user: "{{ ansible_user }}"
      ansible.builtin.shell:
        # include .zshrc if it exists since direnv is installed by zinit
        cmd: |
          if [ -f "$HOME/.zshrc" ]; then
            . "$HOME/.zshrc"
          fi
          direnv allow ~
        executable: /bin/zsh
      when: not dotfiles__direnv_stat.stat.exists
