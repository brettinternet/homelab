---
- name: Install packages
  community.general.pacman:
    name: [git, neovim, tmux, zsh, bat, lsd]
    state: present

- name: "Set user shell to {{ dotfiles__shell }}"
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: "{{ dotfiles__shell }}"

- name: Clone dotfiles repo # noqa latest[git]
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: "{{ dotfiles__repo }}"
    dest: "{{ dotfiles__dir }}"
    accept_hostkey: true
    update: true
    depth: 1
  notify: Run dotfiles install

- name: Setup system env vars
  when: dotfiles__direnv_lines | length > 0
  block:
    - name: Add private environment values
      become: true
      become_user: "{{ ansible_user }}"
      ansible.builtin.lineinfile:
        path: "{{ dotfiles__direnv_file }}"
        line: "{{ item }}"
        state: present
      loop: "{{ dotfiles__direnv_lines }}"
      notify: Allow user directory direnv
