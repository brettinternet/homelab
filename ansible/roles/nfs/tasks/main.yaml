---
- name: Install nfs-utils
  community.general.pacman:
    name: nfs-utils
    state: present

- name: Copy exports file
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload exports

- name: Create NFS systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nfs-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Otherwise NFS can start at boot before the pool mounts and export empty mountpoints.
- name: Start NFS after exported filesystems mount
  ansible.builtin.copy:
    content: |
      [Unit]
      RequiresMountsFor={{ nfs__exports | map('split') | map('first') | join(' ') }}
    dest: /etc/systemd/system/nfs-server.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable NFS server
  ansible.builtin.systemd:
    name: nfs-server.service
    state: started
    enabled: true
