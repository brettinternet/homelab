---
- name: Install docker
  community.general.pacman:
    name: docker
    state: present

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    append: true
    groups: [docker]

- name: Create docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

# The default json-file driver never rotates. Takes effect on the next docker
# restart, for containers created after it.
- name: Configure docker daemon
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "local"
      }
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"

- name: Enable docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes
- name: Set UDP buffer sizes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-sysctl.conf
    reload: true
  loop: "{{ {'net.core.rmem_max': 2500000, 'net.core.wmem_max': 2500000} | dict2items }}"
