---
- name: Base
  hosts: all
  become: true
  pre_tasks:
    - name: Check distribution
      ansible.builtin.assert:
        that: ansible_facts['distribution'] == 'Archlinux'
        fail_msg: "Only Arch Linux is supported, found {{ ansible_facts['distribution'] }}"
  roles:
    - os
    - user
    - ssh
    - etckeeper
    - dotfiles
    - atuin

- name: Storage
  hosts: storage
  become: true
  tags: [storage]
  roles:
    - mergerfs
    - snapraid
    - role: nfs
      when: nfs__exports | length > 0

- name: Docker
  hosts: docker
  become: true
  tags: [docker]
  roles:
    - docker

- name: Cockpit
  hosts: cockpit
  become: true
  tags: [cockpit]
  roles:
    - cockpit
