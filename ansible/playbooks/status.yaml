---
- name: Status
  hosts: all
  become: true
  tasks:
    - name: Check for pending kernel reboot
      ansible.builtin.include_role:
        name: upgrade
        tasks_from: reboot_required

    - name: Host status
      ansible.builtin.debug:
        msg:
          - "Address: {{ ansible_facts['default_ipv4']['address'] }}/{{ ansible_facts['default_ipv4']['prefix'] }}"
          - "Kernel: {{ ansible_facts['kernel'] }}"
          - "Processor: {{ ansible_facts['processor'][2] }} ({{ ansible_facts['processor_vcpus'] }} threads)"
          - "Reboot required: {{ upgrade__reboot_required }}"
          - "Groups: {{ group_names }}"
