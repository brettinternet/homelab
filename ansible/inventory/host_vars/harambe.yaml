# List order is the parity level and must not change without a full `snapraid sync`.
snapraid__parity:
  - /mnt/parity2/snapraid.parity
  - /mnt/parity1/snapraid.parity
snapraid__content:
  - /var/snapraid/snapraid.content
  - /mnt/disk1/.snapraid.content
  - /mnt/disk2/.snapraid.content
  - /mnt/disk3/.snapraid.content
snapraid__data:
  d1: /mnt/disk1
  d2: /mnt/disk2
  d3: /mnt/disk3
  d4: /mnt/disk4
  d5: /mnt/disk5
  d6: /mnt/disk6
  d7: /mnt/disk7
  d8: /mnt/disk8
  d9: /mnt/disk9
  d10: /mnt/disk10

snapraid__daemon_net_enabled: 1
snapraid__daemon_net_port: 10.1.2.4:7627
snapraid__daemon_healthcheck_url: "{{ healthchecks__ping_url }}/{{ healthchecks__snapraid_runner_uuid }}"
# Homepage on the net stack (sienna); switch to gresham's IP after the migration.
snapraid__daemon_net_acl: +10.1.0.5

